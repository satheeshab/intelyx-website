AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Intelyx static website hosting: private S3 bucket + CloudFront (OAC),
  ACM certificate, CloudFront Function (apex -> www, clean URLs), security
  headers, cache policies, optional Route 53 records and an optional GitHub
  Actions OIDC deploy role.
  IMPORTANT: deploy this stack in us-east-1 (CloudFront certificates must live there).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  DomainName:
    Type: String
    Default: intelyx.co.in
    Description: Apex domain. The site is served on www.<DomainName>; the apex redirects to www.

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Route 53 hosted zone ID for DomainName (e.g. Z0123456789ABC). Leave empty if DNS
      stays with your registrar: you will then add the ACM validation and site CNAME
      records there by hand (see README).

  ApiOrigin:
    Type: String
    Default: https://*.execute-api.ap-south-1.amazonaws.com
    Description: >
      Origin of the enquiry API, allowed in the Content-Security-Policy connect-src.
      Use the "ApiOrigin" output of the backend stack for the tightest policy.

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_200 includes edge locations in India.

  GitHubRepository:
    Type: String
    Default: ""
    Description: >
      Optional "owner/repo" (e.g. satheeshab/intelyx-website). When set, creates an IAM role
      that GitHub Actions can assume with OIDC to deploy the site. Leave empty to skip.

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to deploy via GitHub Actions.

  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if this AWS account already has the
      token.actions.githubusercontent.com OIDC provider.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasGitHub: !Not [!Equals [!Ref GitHubRepository, ""]]
  CreateOidcProvider: !And
    - !Condition HasGitHub
    - !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # -------------------------------------------------------------------------
  # S3 bucket: private, Block Public Access on, versioned, encrypted
  # -------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # e.g. intelyx-site-123456789012 (no dots, which break S3 TLS hostnames)
      BucketName: !Join ["-", [!Select [0, !Split [".", !Ref DomainName]], "site", !Ref AWS::AccountId]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Only this CloudFront distribution may read objects
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Intelyx site bucket access
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # -------------------------------------------------------------------------
  # TLS certificate (DNS validation). With HostedZoneId the validation records
  # are created automatically; otherwise the stack waits until you add the
  # CNAME shown in the CloudFormation events / ACM console at your registrar.
  # -------------------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "www.${DomainName}"
      SubjectAlternativeNames:
        - !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  # -------------------------------------------------------------------------
  # CloudFront Function (viewer request):
  #   - https://intelyx.co.in/...  -> 301 https://www.intelyx.co.in/...
  #   - /index.html                -> 301 /
  #   - /about  or /about/         -> serves /about.html
  # -------------------------------------------------------------------------
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Apex to www redirect and clean URLs
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var APEX = '${DomainName}';
        var CANONICAL_HOST = 'www.' + APEX;

        function queryString(qs) {
          var parts = [];
          Object.keys(qs).forEach(function (key) {
            var item = qs[key];
            if (item.multiValue) {
              item.multiValue.forEach(function (v) { parts.push(key + '=' + v.value); });
            } else {
              parts.push(item.value === '' ? key : key + '=' + item.value);
            }
          });
          return parts.length ? '?' + parts.join('&') : '';
        }

        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: location },
              'cache-control': { value: 'public, max-age=3600' }
            }
          };
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';
          var uri = request.uri;

          // 1. Apex domain -> www (keep path and query string)
          if (host === APEX) {
            return redirect('https://' + CANONICAL_HOST + uri + queryString(request.querystring));
          }

          // 2. /index.html -> /
          if (uri === '/index.html') {
            return redirect('/' + queryString(request.querystring));
          }

          // 3. Clean URLs: /about or /about/ -> /about.html
          if (uri === '/') {
            request.uri = '/index.html';
          } else {
            if (uri.length > 1 && uri.charAt(uri.length - 1) === '/') {
              uri = uri.slice(0, -1);
            }
            var last = uri.substring(uri.lastIndexOf('/') + 1);
            request.uri = last.indexOf('.') === -1 ? uri + '.html' : uri;
          }
          return request;
        }

  # -------------------------------------------------------------------------
  # Security headers
  # -------------------------------------------------------------------------
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: HSTS, CSP and other security headers for the Intelyx site
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data: https://*.google.com https://*.googleapis.com https://*.gstatic.com;
              frame-src https://www.google.com https://maps.google.com;
              connect-src 'self' ${ApiOrigin};
              form-action 'self';
              frame-ancestors 'none';
              base-uri 'self';
              object-src 'none';
              upgrade-insecure-requests
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  # -------------------------------------------------------------------------
  # Cache policies: long for /assets/*, short for HTML
  # -------------------------------------------------------------------------
  AssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-assets"
        Comment: Long cache for /assets/* (CSS/JS are versioned with ?v=)
        DefaultTTL: 2592000     # 30 days
        MaxTTL: 31536000        # 1 year
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [v]

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-html"
        Comment: Short cache for HTML pages
        DefaultTTL: 300         # 5 minutes
        MaxTTL: 3600            # 1 hour
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none   # ?product=&type= are read by JavaScript only

  # -------------------------------------------------------------------------
  # CloudFront distribution
  # -------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Intelyx website
        Enabled: true
        Aliases:
          - !Sub "www.${DomainName}"
          - !Ref DomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref HtmlCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: SiteBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref AssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        # With OAC, S3 answers 403 for missing objects; show the 404 page for both.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # -------------------------------------------------------------------------
  # Route 53 alias records (only when HostedZoneId is provided)
  # Z2FDTNDATAQYW2 is the fixed hosted zone ID for all CloudFront distributions.
  # -------------------------------------------------------------------------
  WwwARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAaaaRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApexARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApexAaaaRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # -------------------------------------------------------------------------
  # Optional: GitHub Actions deploy role (OIDC, no long-lived keys)
  # -------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHub
    Properties:
      Description: Assumed by GitHub Actions to deploy the Intelyx website
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # The workflow deploys through the "production" GitHub environment;
                # the branch form is also accepted for workflows without an environment.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepository}:environment:production"
                  - !Sub "repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: Upload the site here (aws s3 sync ... s3://<BucketName>)
    Value: !Ref SiteBucket
  DistributionId:
    Description: Use for cache invalidations
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point www (CNAME) and the apex (ALIAS/ANAME) here if DNS is not in Route 53
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  GitHubDeployRoleArn:
    Condition: HasGitHub
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable in GitHub
    Value: !GetAtt GitHubDeployRole.Arn
