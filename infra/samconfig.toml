# SAM CLI defaults for the enquiry backend. Run from the /infra folder:
#   sam build && sam deploy --guided
# The guided deploy will offer these values and can save your answers here.
version = 0.1

[default.global.parameters]
stack_name = "intelyx-enquiry-api"

[default.build.parameters]
template_file = "template.yaml"

[default.deploy.parameters]
region = "ap-south-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "intelyx-enquiry-api"
parameter_overrides = "ToEmail=\"office@intelyx.co.in\" FromEmail=\"no-reply@intelyx.co.in\" SesDomain=\"intelyx.co.in\" SendAck=\"false\""
