AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Intelyx website enquiry API. Browser -> API Gateway (HTTP API, POST /enquiry)
  -> Lambda (Node.js 24) -> Amazon SES -> office@intelyx.co.in.
  Deploy in ap-south-1 (Mumbai):  sam build && sam deploy --guided

# ---------------------------------------------------------------------------
# Parameters (all configuration lives here and in Lambda environment variables)
# ---------------------------------------------------------------------------
Parameters:
  ToEmail:
    Type: String
    Default: office@intelyx.co.in
    Description: Address that receives website enquiries (TO_EMAIL).

  FromEmail:
    Type: String
    Default: no-reply@intelyx.co.in
    Description: Verified SES sender address (FROM_EMAIL). Must belong to SesDomain.

  FromName:
    Type: String
    Default: Intelyx Website
    Description: Display name used on enquiry emails.

  SesDomain:
    Type: String
    Default: intelyx.co.in
    Description: The verified SES domain identity that FromEmail belongs to.

  AllowedOrigins:
    Type: String
    Default: https://www.intelyx.co.in,https://intelyx.co.in,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500
    Description: >
      Comma-separated browser origins allowed to call the API (CORS + Lambda check).
      Remove the localhost entries once you have finished testing.

  SendAck:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "true" sends a branded acknowledgement to the person who submitted the form.
      Requires SES production access (outside the sandbox).

  NodeRuntime:
    Type: String
    Default: nodejs24.x
    AllowedValues: [nodejs20.x, nodejs22.x, nodejs24.x]
    Description: >
      Lambda runtime. nodejs24.x is the default; the code also runs unchanged on
      nodejs22.x. Avoid nodejs20.x: AWS deprecated it on 2026-04-30 (no more security
      patches; new functions blocked from 2027-02-01).

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: How long to keep Lambda and API access logs.

Globals:
  Function:
    Runtime: !Ref NodeRuntime
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  # -------------------------------------------------------------------------
  # HTTP API with CORS and throttling
  # -------------------------------------------------------------------------
  EnquiryHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Intelyx website enquiry API
      # No StageName: SAM creates the auto-deploying "$default" stage,
      # so the URL is https://<id>.execute-api.<region>.amazonaws.com/enquiry
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref AllowedOrigins]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5     # steady-state requests per second
        ThrottlingBurstLimit: 10   # short bursts
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # No IP addresses or request bodies: just enough to troubleshoot.
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: !Ref LogRetentionDays

  # -------------------------------------------------------------------------
  # Lambda function
  # -------------------------------------------------------------------------
  EnquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Validates website enquiries and emails them via SES
      CodeUri: ../backend/enquiry-lambda/
      Handler: index.handler
      Environment:
        Variables:
          TO_EMAIL: !Ref ToEmail
          FROM_EMAIL: !Ref FromEmail
          FROM_NAME: !Ref FromName
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          SEND_ACK: !Ref SendAck
          SES_REGION: !Ref AWS::Region
      # Least privilege: send email only, only from the verified identity,
      # only with FromEmail as the sender address.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: SendFromVerifiedIdentityOnly
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesDomain}
                # Needed while the account is in the SES sandbox (recipient must be verified)
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${ToEmail}
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref FromEmail
      Events:
        PostEnquiry:
          Type: HttpApi
          Properties:
            ApiId: !Ref EnquiryHttpApi
            Path: /enquiry
            Method: POST

  EnquiryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EnquiryFunction}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  EnquiryApiUrl:
    Description: Paste this into /assets/js/config.js (enquiryApiUrl)
    Value: !Sub https://${EnquiryHttpApi}.execute-api.${AWS::Region}.amazonaws.com/enquiry

  ApiOrigin:
    Description: Use as the ApiOrigin parameter of infra/hosting.yaml (Content-Security-Policy connect-src)
    Value: !Sub https://${EnquiryHttpApi}.execute-api.${AWS::Region}.amazonaws.com

  EnquiryFunctionName:
    Description: Lambda function name (for CloudWatch logs)
    Value: !Ref EnquiryFunction
